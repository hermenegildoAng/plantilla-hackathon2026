        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PaginatedAccountCatalogList'
                x-standard-envelope: true
          description: ''
        '400':
          description: Solicitud inválida o error de validación de negocio.
          x-error-codes:
          - validation_error
          - missing_or_invalid_tenant_header
          - period_closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              example:
                success: false
                message: Permisos insuficientes.
                error_id: null
                data: null
                errors:
                - field: null
                  code: validation_error
                  message: No tiene permisos para realizar esta acción.
        '401':
          description: Token JWT ausente, malformado o expirado.
          x-error-codes:
          - authentication_failed
          - token_not_valid
