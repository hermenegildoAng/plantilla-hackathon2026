components:
  schemas:
    AccountCatalog:
      type: object
      description: Chart-of-accounts row used by GET/POST/PATCH /accounts/.
      properties:
        id:
          type: integer
          readOnly: true
        parent:
          type: integer
          nullable: true
        code:
          type: string
          title: Código de cuenta
          maxLength: 30
        sat_group_code:
          type: string
          title: Código agrupador SAT
          maxLength: 15
        name:
          type: string
          title: Nombre de la cuenta
          maxLength: 255
        account_type:
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
          - ORDER
          type: string
          description: |-
            * `ASSET` - Activo
            * `LIABILITY` - Pasivo
            * `EQUITY` - Capital
            * `REVENUE` - Ingresos
            * `EXPENSE` - Costos y gastos
            * `ORDER` - Cuentas de orden
          x-spec-enum-id: 357bb6d229571629
          title: Tipo de cuenta
        nature:
          enum:
          - DEBIT
          - CREDIT
          type: string
          description: |-
            * `DEBIT` - Deudora
            * `CREDIT` - Acreedora
          x-spec-enum-id: cfa8b4bf642b7e6f
          title: Naturaleza
        is_selectable:
          type: boolean
          title: Afectable
        is_active:
          type: boolean
          title: Activa
      required:
      - account_type
      - code
      - id
      - name
      - nature
      - sat_group_code
    AccountCatalogRequest:
      type: object
      description: Chart-of-accounts row used by GET/POST/PATCH /accounts/.
      properties:
        parent:
          type: integer
          nullable: true
        code:
          type: string
          minLength: 1
          title: Código de cuenta
          maxLength: 30
        sat_group_code:
          type: string
          minLength: 1
          title: Código agrupador SAT
          maxLength: 15
        name:
          type: string
          minLength: 1
          title: Nombre de la cuenta
          maxLength: 255
        account_type:
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
          - ORDER
          type: string
          description: |-
            * `ASSET` - Activo
            * `LIABILITY` - Pasivo
            * `EQUITY` - Capital
            * `REVENUE` - Ingresos
            * `EXPENSE` - Costos y gastos
            * `ORDER` - Cuentas de orden
          x-spec-enum-id: 357bb6d229571629
          title: Tipo de cuenta
        nature:
          enum:
          - DEBIT
          - CREDIT
          type: string
          description: |-
            * `DEBIT` - Deudora
            * `CREDIT` - Acreedora
          x-spec-enum-id: cfa8b4bf642b7e6f
          title: Naturaleza
        is_selectable:
          type: boolean
          title: Afectable
        is_active:
          type: boolean
          title: Activa
      required:
      - account_type
      - code
      - name
      - nature
      - sat_group_code
    AccountingEntryDetail:
      type: object
      description: Entry payload from 03 §3.5.
      properties:
        id:
          type: integer
          readOnly: true
        fiscal_period:
          type: integer
          readOnly: true
          title: Periodo fiscal
        period_label:
          type: string
          readOnly: true
        entry_type:
          enum:
          - INCOME
          - EXPENSE
          - JOURNAL
          type: string
          description: |-
            * `INCOME` - Póliza de Ingresos
            * `EXPENSE` - Póliza de Egresos
            * `JOURNAL` - Póliza de Diario
          x-spec-enum-id: dbff8bdcb40bbf7a
          readOnly: true
          title: Tipo de póliza
        folio:
          type: string
          readOnly: true
        entry_date:
          type: string
          format: date
          readOnly: true
          title: Fecha de la póliza
        concept:
          type: string
          readOnly: true
          title: Concepto
        status:
          enum:
          - DRAFT
          - POSTED
          type: string
          description: |-
            * `DRAFT` - Borrador
            * `POSTED` - Contabilizada
          x-spec-enum-id: 0e40d545409367c0
          readOnly: true
          title: Estado
        total_debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Total de cargos
        total_credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Total de abonos
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountingEntryItemRead'
          readOnly: true
      required:
      - concept
      - entry_date
      - entry_type
      - fiscal_period
      - folio
      - id
      - items
      - period_label
      - status
      - total_credit
      - total_debit
    AccountingEntryItemRead:
      type: object
      description: Journal entry line returned by GET /entries/.
      properties:
        id:
          type: integer
          readOnly: true
        line_number:
          type: integer
          readOnly: true
          title: Número de renglón
        account:
          type: integer
          readOnly: true
          title: Cuenta contable
        account_code:
          type: string
          readOnly: true
        account_name:
          type: string
          readOnly: true
        document:
          type: integer
          readOnly: true
          nullable: true
          title: Documento soporte
          description: CFDI / Documento soporte vinculado a este movimiento
        document_uuid:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        description:
          type: string
          readOnly: true
          title: Descripción
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Cargo
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Abono
      required:
      - account
      - account_code
      - account_name
      - credit
      - debit
      - description
      - document
      - document_uuid
      - id
      - line_number
    AccountingEntryItemWrite:
      type: object
      description: Validate one journal entry line (03 §3.5 rules 4 and 5).
      properties:
        account:
          type: integer
        document:
          type: integer
          nullable: true
        description:
          type: string
          default: ''
          maxLength: 255
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          default: '0.00'
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          default: '0.00'
      required:
      - account
    AccountingEntryItemWriteRequest:
      type: object
      description: Validate one journal entry line (03 §3.5 rules 4 and 5).
      properties:
        account:
          type: integer
        document:
          type: integer
          nullable: true
        description:
          type: string
          default: ''
          maxLength: 255
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          default: '0.00'
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          default: '0.00'
      required:
      - account
    AccountingEntryWrite:
      type: object
      description: Validate an entry payload with the seven rules from 03 §3.5.
      properties:
        fiscal_period:
          type: integer
          nullable: true
        entry_type:
          enum:
          - INCOME
          - EXPENSE
          - JOURNAL
          type: string
          description: |-
            * `INCOME` - Póliza de Ingresos
            * `EXPENSE` - Póliza de Egresos
            * `JOURNAL` - Póliza de Diario
          x-spec-enum-id: dbff8bdcb40bbf7a
        entry_date:
          type: string
          format: date
        concept:
          type: string
          maxLength: 500
        status:
          enum:
          - DRAFT
          - POSTED
          type: string
          description: |-
            * `DRAFT` - Borrador
            * `POSTED` - Contabilizada
          x-spec-enum-id: 0e40d545409367c0
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountingEntryItemWrite'
      required:
      - concept
      - entry_date
      - entry_type
      - items
    AccountingEntryWriteRequest:
      type: object
      description: Validate an entry payload with the seven rules from 03 §3.5.
      properties:
        fiscal_period:
          type: integer
          nullable: true
        entry_type:
          enum:
          - INCOME
          - EXPENSE
          - JOURNAL
          type: string
          description: |-
            * `INCOME` - Póliza de Ingresos
            * `EXPENSE` - Póliza de Egresos
            * `JOURNAL` - Póliza de Diario
          x-spec-enum-id: dbff8bdcb40bbf7a
        entry_date:
          type: string
          format: date
        concept:
          type: string
          minLength: 1
          maxLength: 500
        status:
          enum:
          - DRAFT
          - POSTED
          type: string
          description: |-
            * `DRAFT` - Borrador
            * `POSTED` - Contabilizada
          x-spec-enum-id: 0e40d545409367c0
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountingEntryItemWriteRequest'
      required:
      - concept
      - entry_date
      - entry_type
      - items
    AuditLog:
      type: object
      description: Read-only audit trail row [E-21].
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          title: Usuario
        user_name:
          type: string
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        action:
          enum:
          - PERIOD_CLOSED
          - PERIOD_REOPENED
          - ENTRY_DELETED
          - ROLE_CHANGED
          - CATALOG_MODIFIED
          type: string
          description: |-
            * `PERIOD_CLOSED` - Cierre de Periodo Fiscal
            * `PERIOD_REOPENED` - Reapertura Extraordinaria de Periodo
            * `ENTRY_DELETED` - Eliminación de Póliza
            * `ROLE_CHANGED` - Cambio de Rol de Usuario
            * `CATALOG_MODIFIED` - Modificación de Catálogo Contable
          x-spec-enum-id: 475c3066614d2e07
          readOnly: true
          title: Acción
        action_display:
          type: string
          readOnly: true
        target_model:
          type: string
          readOnly: true
          title: Modelo afectado
        target_id:
          type: string
          readOnly: true
          title: ID afectado
        justification:
          type: string
          readOnly: true
          title: Justificación
          description: Motivo de la acción. El mínimo de 15 caracteres en la reapertura
            de periodos se valida en PeriodReopenSerializer, no en el modelo.
        previous_state:
          readOnly: true
          title: Estado anterior
        new_state:
          readOnly: true
          title: Estado nuevo
        ip_address:
          type: string
          readOnly: true
          nullable: true
          title: Dirección IP
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - action_display
      - created_at
      - id
      - ip_address
      - justification
      - new_state
      - previous_state
      - target_id
      - target_model
      - user
      - user_email
      - user_name
    BankMovement:
      type: object
      description: Read-only bank movement representation; money stays as strings.
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
          title: Fecha del movimiento
        reference:
          type: string
          readOnly: true
          title: Referencia bancaria
        description:
          type: string
          readOnly: true
          title: Concepto
        deposit:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Depósito
        withdrawal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Retiro
        status:
          enum:
          - PENDING
          - RECONCILED
          type: string
          description: |-
            * `PENDING` - Pendiente
            * `RECONCILED` - Conciliado
          x-spec-enum-id: 73622ccf96f6ebc0
          readOnly: true
          title: Estado
        entry:
          type: integer
          readOnly: true
          nullable: true
          title: Póliza vinculada
        entry_folio:
          type: string
          readOnly: true
          nullable: true
        document:
          type: integer
          readOnly: true
          nullable: true
          title: Documento vinculado
        document_uuid:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        import_batch:
          type: string
          format: uuid
          readOnly: true
          title: Lote de importación
        row_hash:
          type: string
          readOnly: true
