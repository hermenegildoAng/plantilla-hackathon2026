    CompanyCreate:
      type: object
      description: Create a company, its PARTNER membership and clone the SAT catalog.
      properties:
        id:
          type: integer
          readOnly: true
        rfc:
          type: string
          pattern: ^([A-Z\u00d1&]{3,4}) ?(?:- ?)?(\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01]))
            ?(?:- ?)?([A-Z\d]{2})([A\d])$
          maxLength: 13
        legal_name:
          type: string
          maxLength: 255
        tax_regime:
          enum:
          - '612'
          - '626'
          - '601'
          type: string
          description: |-
            * `612` - 612 - Personas Físicas con Actividades Empresariales y Profesionales
