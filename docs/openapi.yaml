openapi: 3.0.3
info:
  title: API Contable Multi-Tenant
  version: 1.0.0
  description: API REST del sistema contable multi-tenant para México. Todas las respuestas
    exitosas usan el envoltorio {success, message, data, errors}; los errores usan
    {success, message, error_id, data, errors} con errors como arreglo de {field,
    code, message}.
